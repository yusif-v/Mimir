[tool]
name = "python-registry"
description = "Windows registry hive parsing with python-registry (scriptable)"
category = "forensics"
tags = ["windows", "registry", "hive", "python", "scriptable"]

[docker]
image = "dfir-python-registry:latest"
workdir = "/output"

[[docker.volumes]]
host = "evidence"
container = "/evidence"
mode = "ro"

[[docker.volumes]]
host = "output"
container = "/output"
mode = "rw"
